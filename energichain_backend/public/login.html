<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EnergyChain - Sign In</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-canvas: #0D1117;
            --bg-subtle: #090C10;
            --bg-surface: #161B22;
            --bg-surface-hover: #1F2630;
            --bg-input: #0D1117;

            --border-default: #30363D;
            --border-muted: #21262D;
            --border-active: #8B949E;

            --text-primary: #F0F6FC;
            --text-secondary: #8B949E;
            --text-muted: #6E7681;

            --accent-primary: #238636;
            --accent-primary-hover: #2EA043;
            --accent-primary-soft: rgba(46, 160, 67, 0.14);
            --accent-primary-text: #3FB950;

            --accent-web3: #F6851B;
            --accent-web3-soft: rgba(246, 133, 27, 0.14);
            --accent-web3-text: #F6A44B;

            --accent-wind: #58A6FF;
            --accent-wind-soft: rgba(88, 166, 255, 0.14);
            --accent-wind-text: #79C0FF;

            --accent-danger: #F85149;
            --accent-danger-soft: rgba(248, 81, 73, 0.14);

            --accent-warning: #D29922;
            --accent-warning-soft: rgba(210, 153, 34, 0.14);

            --focus-ring: 0 0 0 3px rgba(88, 166, 255, 0.3);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-canvas);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .font-mono {
            font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
            font-variant-numeric: tabular-nums;
        }

        .nav-blur {
            background-color: rgba(13, 17, 23, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-default);
        }

        .auth-card {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-default);
            border-radius: 8px;
            box-shadow: 0 16px 36px -8px rgba(0, 0, 0, 0.6);
        }

        .auth-input {
            width: 100%;
            background-color: var(--bg-input);
            border: 1px solid var(--border-default);
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 14px;
            color: var(--text-primary);
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }
        .auth-input:focus {
            outline: none;
            border-color: #58A6FF;
            box-shadow: var(--focus-ring);
        }
        .auth-input::placeholder {
            color: var(--text-muted);
        }

        .btn-primary {
            background-color: var(--accent-primary);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 6px;
            padding: 9px 16px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.15s ease, border-color 0.15s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .btn-primary:hover:not(:disabled) {
            background-color: var(--accent-primary-hover);
        }
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .auth-notice {
            display: none;
            margin-top: 1rem;
            border-radius: 6px;
            padding: 10px 14px;
            font-size: 13px;
            line-height: 1.4;
        }
        .auth-notice.is-visible {
            display: block;
        }
        .auth-notice--loading {
            background-color: var(--accent-wind-soft);
            color: var(--accent-wind-text);
            border: 1px solid rgba(88, 166, 255, 0.3);
        }
        .auth-notice--success {
            background-color: var(--accent-primary-soft);
            color: var(--accent-primary-text);
            border: 1px solid rgba(46, 160, 67, 0.3);
        }
        .auth-notice--error {
            background-color: var(--accent-danger-soft);
            color: #ff7b72;
            border: 1px solid rgba(248, 81, 73, 0.3);
        }

        a:focus-visible, button:focus-visible, input:focus-visible {
            outline: none;
            box-shadow: var(--focus-ring);
        }
    </style>
</head>
<body class="antialiased">

    <!-- Top Navigation Bar -->
    <nav id="navbar" class="w-full fixed top-0 z-50 nav-blur">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <!-- Brand -->
                <a href="index.html" class="flex items-center space-x-3 group">
                    <div class="w-8 h-8 rounded-md bg-[rgba(46,160,67,0.15)] border border-[rgba(46,160,67,0.3)] flex items-center justify-center text-[var(--accent-primary-text)] group-hover:border-[var(--accent-primary-text)] transition-colors">
                        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M11.3 1.046A1 1 0 0112 2v5h4a1 1 0 01.82 1.573l-7 10A1 1 0 018 18v-5H4a1 1 0 01-.82-1.573l7-10a1 1 0 011.12-.38z"/>
                        </svg>
                    </div>
                    <span class="text-base font-bold text-[var(--text-primary)] tracking-tight">EnergyChain</span>
                </a>

                <!-- Right Actions -->
                <div class="flex items-center space-x-3">
                    <a href="index.html" class="text-xs font-medium text-[var(--text-secondary)] hover:text-[var(--text-primary)] px-2.5 py-1.5 rounded transition-colors">
                        Home
                    </a>
                    <a href="signup.html" class="text-xs font-medium text-[var(--text-primary)] bg-[var(--bg-surface)] hover:bg-[var(--bg-surface-hover)] border border-[var(--border-default)] hover:border-[var(--border-active)] px-3 py-1.5 rounded-md transition-all">
                        Sign Up
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="flex-grow flex flex-col items-center justify-center px-4 pt-24 pb-12 relative">
        <!-- Subtle Top Radial Glow -->
        <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[600px] h-[260px] pointer-events-none opacity-20" style="background: radial-gradient(circle at 50% 0%, rgba(46, 160, 67, 0.45), transparent 70%);"></div>

        <div class="w-full max-w-[380px] z-10">
            <!-- Header Icon & Title -->
            <div class="text-center mb-6">
                <div class="inline-flex w-12 h-12 rounded-full bg-[var(--bg-surface)] border border-[var(--border-default)] items-center justify-center text-[var(--accent-primary-text)] mb-3 shadow-sm">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M11.3 1.046A1 1 0 0112 2v5h4a1 1 0 01.82 1.573l-7 10A1 1 0 018 18v-5H4a1 1 0 01-.82-1.573l7-10a1 1 0 011.12-.38z"/>
                    </svg>
                </div>
                <h1 class="text-xl font-semibold text-[var(--text-primary)] tracking-tight">Sign in to EnergyChain</h1>
                <p class="text-xs text-[var(--text-secondary)] mt-1">Access your decentralized energy dashboard</p>
            </div>

            <!-- Main Auth Card -->
            <div class="auth-card p-6">
                <form id="loginForm" class="space-y-4">
                    <div>
                        <label class="block text-xs font-medium text-[var(--text-primary)] mb-1.5" for="email">Email address</label>
                        <input type="email" id="email" name="email" required autocomplete="email" class="auth-input font-mono" placeholder="prosumer@grid.eth">
                    </div>

                    <div>
                        <div class="flex items-center justify-between mb-1.5">
                            <label class="block text-xs font-medium text-[var(--text-primary)]" for="password">Password</label>
                            <a id="forgotPasswordBtn" href="#authNotice" class="text-xs text-[var(--accent-wind-text)] hover:underline">Forgot password?</a>
                        </div>
                        <input type="password" id="password" name="password" required autocomplete="current-password" class="auth-input" placeholder="••••••••••••">
                    </div>

                    <div class="flex items-center pt-0.5">
                        <input type="checkbox" id="remember" name="remember" class="w-4 h-4 rounded bg-[var(--bg-input)] border-[var(--border-default)] text-[var(--accent-primary)] focus:ring-[var(--focus-ring)] focus:ring-offset-0 cursor-pointer">
                        <label for="remember" class="ml-2 text-xs text-[var(--text-secondary)] cursor-pointer select-none">Remember this browser session</label>
                    </div>

                    <div class="pt-1">
                        <button id="loginSubmitBtn" type="submit" class="btn-primary w-full">
                            <span id="loginSubmitText">Sign In</span>
                            <span id="loginSubmitSpinner" class="hidden ml-2 font-mono" aria-hidden="true">●</span>
                        </button>
                    </div>
                </form>

                <!-- Auth Notice Status Banner -->
                <div id="authNotice" class="auth-notice" role="status" aria-live="polite"></div>
            </div>

            <!-- New to EnergyChain Box (GitHub Style Sub-box) -->
            <div class="mt-4 p-4 rounded-md border border-[var(--border-default)] bg-[var(--bg-surface)] text-center text-xs text-[var(--text-secondary)]">
                New to EnergyChain?
                <a href="signup.html" class="text-[var(--accent-primary-text)] font-medium hover:underline ml-1">Create an account →</a>
            </div>
        </div>
    </main>

    <!-- Minimalist Footer -->
    <footer class="py-6 border-t border-[var(--border-muted)] bg-[var(--bg-subtle)] text-center text-xs text-[var(--text-muted)]">
        <div class="flex items-center justify-center space-x-4 mb-2">
            <a href="index.html" class="hover:text-[var(--text-secondary)] transition-colors">Home</a>
            <span>·</span>
            <a href="dashboard.html" class="hover:text-[var(--text-secondary)] transition-colors">App</a>
            <span>·</span>
            <a href="https://sepolia.etherscan.io" target="_blank" rel="noopener noreferrer" class="hover:text-[var(--text-secondary)] transition-colors">Sepolia Explorer</a>
        </div>
        <p>&copy; 2025 EnergyChain Protocol. All rights reserved.</p>
    </footer>

    <!-- Preserved Login Script -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const form = document.getElementById("loginForm");
            const submitButton = document.getElementById("loginSubmitBtn");
            const submitText = document.getElementById("loginSubmitText");
            const submitSpinner = document.getElementById("loginSubmitSpinner");
            const notice = document.getElementById("authNotice");
            const setAuthState = (message, type) => {
                notice.textContent = message;
                notice.className = `auth-notice is-visible auth-notice--${type}`;
                const pending = type === "loading";
                submitButton.disabled = pending;
                submitText.textContent = pending ? "Signing in…" : "Sign In";
                submitSpinner.classList.toggle("hidden", !pending);
            };

            document.getElementById("forgotPasswordBtn").addEventListener("click", function (event) {
                event.preventDefault();
                setAuthState("Password recovery is not configured for this deployment. Use the credentials from your registered account.", "error");
                notice.scrollIntoView({ behavior: "smooth", block: "nearest" });
            });

            form.addEventListener("submit", async function (e) {
                e.preventDefault();

                const email = document.getElementById("email").value.trim().toLowerCase();
                const password = document.getElementById("password").value;

                if (!email || !password) {
                    setAuthState("Enter both your email address and password.", "error");
                    alert("Please enter both email and password.");
                    return;
                }

                setAuthState("Authenticating your account…", "loading");

                try {
                    const response = await fetch("/auth/login", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ email, password })
                    });
                    const result = await response.json().catch(() => ({}));
                    if (response.ok && result.token) {
                        setAuthState("Signed in successfully. Opening your dashboard…", "success");
                        sessionStorage.clear();
                        sessionStorage.setItem("userName", result.user.name);
                        sessionStorage.setItem("userEmail", result.user.email);
                        sessionStorage.setItem("isLoggedIn", "true");
                        sessionStorage.setItem("authToken", result.token);
                        alert(`Welcome back, ${result.user.name}!`);
                        window.location.href = "dashboard.html";
                        return;
                    }
                } catch (error) {
                    console.warn("Backend login unavailable; trying local fallback.", error);
                }

                const users = JSON.parse(localStorage.getItem("energyUsers") || "[]");
                const user = users.find(u => u.email === email && u.password === password);

                if (user) {
                    // Link a legacy browser-only account to the backend on
                    // first login, enabling protected booking features.
                    let token = "web3-jwt-" + Date.now();
                    try {
                        const linkResponse = await fetch("/auth/signup", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ name: user.name, email, password })
                        });
                        const linkResult = await linkResponse.json().catch(() => ({}));
                        if (linkResponse.ok && linkResult.token) token = linkResult.token;
                    } catch (error) {
                        console.warn("Backend account link unavailable; using local fallback.", error);
                    }

                    // SAVE TO SESSION
                    setAuthState("Signed in successfully. Opening your dashboard…", "success");
                    sessionStorage.clear();
                    sessionStorage.setItem("userName", user.name);
                    sessionStorage.setItem("userEmail", email);
                    sessionStorage.setItem("isLoggedIn", "true");
                    sessionStorage.setItem("authToken", token);

                    alert(`Welcome back, ${user.name}!`);
                    window.location.href = "dashboard.html";
                } else {
                    setAuthState("Invalid email or password. Try signing up first.", "error");
                    alert("Invalid email or password. Try signing up first!");
                }
            });
        });
    </script>
</body>
</html>
