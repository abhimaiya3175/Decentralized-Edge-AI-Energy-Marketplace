<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EnergyChain - Sign Up</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        * {
            scroll-behavior: smooth;
        }

        .energy-gradient {
            background: linear-gradient(135deg, #10b981 0%, #059669 50%, #047857 100%);
        }

        .gradient-text {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .btn-glow {
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-glow::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }

        .btn-glow:hover::before {
            left: 100%;
        }

        .btn-glow:hover {
            box-shadow: 0 0 30px rgba(16, 185, 129, 0.6);
            transform: translateY(-2px);
        }

        .reveal-scale {
            opacity: 0;
            transform: scale(0.9);
            transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .reveal-scale.active {
            opacity: 1;
            transform: scale(1);
        }

        :root { --ec-ink: #17211d; --ec-muted: #637067; --ec-border: #dfe7e1; --ec-primary: #047857; --ec-page: #f6f8f6; }
        body { background: var(--ec-page); color: var(--ec-ink); }
        nav { border-bottom: 1px solid var(--ec-border); box-shadow: 0 1px 0 rgba(15, 46, 31, .05) !important; }
        .auth-shell { background: radial-gradient(circle at top right, rgba(16, 185, 129, .12), transparent 32%), var(--ec-page) !important; }
        .auth-card { box-sizing: border-box; width: min(100%, 28rem) !important; max-width: calc(100vw - 2rem) !important; border: 1px solid var(--ec-border); border-radius: 1rem !important; box-shadow: 0 18px 42px rgba(15, 46, 31, .1) !important; }
        .auth-kicker { color: var(--ec-primary); font-size: .75rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
        .auth-card input { border-color: #cfd9d2 !important; min-height: 3rem; }
        .auth-card input:focus { border-color: var(--ec-primary) !important; box-shadow: 0 0 0 3px rgba(16, 185, 129, .12); }
        .auth-help { color: var(--ec-muted); font-size: .75rem; margin-top: .45rem; }
        .auth-notice { display: none; margin-top: 1rem; border-radius: .65rem; padding: .75rem .9rem; font-size: .875rem; font-weight: 600; }
        .auth-notice.is-visible { display: block; }
        .auth-notice--loading { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }
        .auth-notice--success { background: #ecfdf5; color: #047857; border: 1px solid #a7f3d0; }
        .auth-notice--error { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
        button:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid rgba(16,185,129,.38); outline-offset: 2px; }
        nav .text-2xl { font-size: clamp(1.25rem, 4vw, 1.5rem); }
        .auth-nav-actions { gap: .35rem !important; flex-wrap: nowrap; }
        .auth-nav-actions > :not([hidden]) ~ :not([hidden]) { margin-left: 0 !important; }
        .auth-nav-actions a { padding-left: clamp(.5rem, 1.5vw, .75rem); padding-right: clamp(.5rem, 1.5vw, .75rem); font-size: clamp(.75rem, 2.5vw, .875rem); white-space: nowrap; }
    </style>
</head>

<body class="font-sans antialiased bg-gray-50 overflow-x-hidden">

    <!-- Navbar -->
    <nav id="navbar" class="fixed w-full top-0 z-50 bg-white transition-all duration-500">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center space-x-3">
                    <svg class="w-8 h-8 text-green-600" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd"
                            d="M11.3 1.046A1 1 0 0112 2v5h4a1 1 0 01.82 1.573l-7 10A1 1 0 018 18v-5H4a1 1 0 01-.82-1.573l7-10a1 1 0 011.12-.38z" />
                    </svg>
                    <div class="text-2xl font-bold gradient-text">EnergyChain</div>
                </div>
                <div class="auth-nav-actions flex items-center space-x-4">
                    <a href="login.html"
                        class="energy-gradient text-white px-6 py-2 rounded-lg font-semibold btn-glow">Log In</a>
                    <a href="index.html"
                        class="energy-gradient text-white px-6 py-2 rounded-lg font-semibold btn-glow">Home</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Sign Up Section -->
    <section
        class="auth-shell flex items-center justify-center min-h-screen pt-16 px-4 sm:px-6 lg:px-8 bg-gradient-to-br from-green-50 via-emerald-50 to-teal-50 relative">
        <div class="absolute inset-0 opacity-10">
            <div class="absolute top-20 left-10 w-64 h-64 bg-green-400 rounded-full filter blur-3xl"></div>
            <div class="absolute bottom-20 right-10 w-96 h-96 bg-emerald-400 rounded-full filter blur-3xl"></div>
        </div>

        <div class="auth-card max-w-md w-full bg-white rounded-3xl shadow-2xl p-8 z-10 reveal-scale">
            <div class="text-center mb-8">
                <p class="auth-kicker mb-2">Create your marketplace account</p>
                <h2 class="text-4xl font-bold text-gray-900 mb-2 gradient-text">Sign Up</h2>
                <p class="text-gray-600">Join EnergyChain and start trading green energy securely.</p>
            </div>

            <!-- SIGNUP FORM -->
            <form id="signupForm">
                <div class="mb-6">
                    <label class="block text-gray-700 font-semibold mb-2" for="name">Name</label>
                    <input type="text" id="name" name="name" required
                        class="w-full px-4 py-3 rounded-lg border border-gray-200 focus:outline-none focus:border-green-500 transition duration-300 shadow-sm"
                        placeholder="Your full name">
                </div>

                <div class="mb-6">
                    <label class="block text-gray-700 font-semibold mb-2" for="email">Email</label>
                    <input type="email" id="email" name="email" required
                        class="w-full px-4 py-3 rounded-lg border border-gray-200 focus:outline-none focus:border-green-500 transition duration-300 shadow-sm"
                        placeholder="you@domain.com">
                </div>

                <div class="mb-6">
                    <label class="block text-gray-700 font-semibold mb-2" for="password">Password</label>
                    <input type="password" id="password" name="password" required
                        class="w-full px-4 py-3 rounded-lg border border-gray-200 focus:outline-none focus:border-green-500 transition duration-300 shadow-sm"
                        placeholder="Strong password">
                    <p class="auth-help">Use at least 6 characters.</p>
                </div>

                <button id="signupSubmitBtn" type="submit"
                    class="energy-gradient text-white w-full py-3 rounded-lg font-semibold text-lg btn-glow mt-4">
                    <span id="signupSubmitText">Create Account</span><span id="signupSubmitSpinner" class="hidden ml-2" aria-hidden="true">●</span>
                </button>
            </form>

            <div id="signupNotice" class="auth-notice" role="status" aria-live="polite"></div>

            <div class="text-center text-gray-600 mt-6">
                Already have an account?
                <a href="login.html" class="text-green-600 font-semibold hover:underline">Log In</a>
            </div>
        </div>
    </section>

    <footer class="py-10 bg-white border-t border-gray-200 mt-10">
        <div class="max-w-7xl mx-auto text-center text-gray-600">
            © 2025 EnergyChain. All rights reserved.
        </div>
    </footer>

    <!-- SIGNUP SCRIPT — NO BACKEND, PURE FRONTEND -->
    <script>
        // Reveal animation
        function revealOnScroll() {
            const reveals = document.querySelectorAll('.reveal-scale');
            reveals.forEach(reveal => {
                const windowHeight = window.innerHeight;
                const elementTop = reveal.getBoundingClientRect().top;
                const revealPoint = 80;
                if (elementTop < windowHeight - revealPoint) {
                    reveal.classList.add('active');
                } else {
                    reveal.classList.remove('active');
                }
            });
        }
        window.addEventListener('scroll', revealOnScroll);
        window.addEventListener('load', revealOnScroll);

        // Create a backend account when available, while preserving the
        // existing local-browser account fallback.
        document.addEventListener("DOMContentLoaded", function () {
            const form = document.getElementById("signupForm");
            const submitButton = document.getElementById("signupSubmitBtn");
            const submitText = document.getElementById("signupSubmitText");
            const submitSpinner = document.getElementById("signupSubmitSpinner");
            const notice = document.getElementById("signupNotice");
            const setSignupState = (message, type) => {
                notice.textContent = message;
                notice.className = `auth-notice is-visible auth-notice--${type}`;
                const pending = type === "loading";
                submitButton.disabled = pending;
                submitText.textContent = pending ? "Creating account…" : "Create Account";
                submitSpinner.classList.toggle("hidden", !pending);
            };

            form.addEventListener("submit", async function (e) {
                e.preventDefault();

                const name = document.getElementById("name").value.trim();
                const email = document.getElementById("email").value.trim().toLowerCase();
                const password = document.getElementById("password").value;

                // Basic validation
                if (!name || !email || !password) {
                    setSignupState("Complete your name, email address, and password to continue.", "error");
                    alert("Please fill in all fields.");
                    return;
                }

                if (password.length < 6) {
                    setSignupState("Your password must have at least 6 characters.", "error");
                    alert("Password must be at least 6 characters.");
                    return;
                }

                setSignupState("Creating your account…", "loading");

                const users = JSON.parse(localStorage.getItem("energyUsers") || "[]");
                const localUser = users.find(u => u.email === email);
                let backendSession = null;

                try {
                    let response = await fetch("/auth/signup", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ name, email, password })
                    });
                    let result = await response.json().catch(() => ({}));

                    // A local user can use this form once to link their
                    // existing browser account to the backend account.
                    if (!response.ok && result.msg === "User already exists") {
                        response = await fetch("/auth/login", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ email, password })
                        });
                        result = await response.json().catch(() => ({}));
                    }
                    if (response.ok && result.token) backendSession = result;
                } catch (error) {
                    console.warn("Backend signup unavailable; using local fallback.", error);
                }

                if (!localUser) {
                    users.push({ name, email, password });
                    localStorage.setItem("energyUsers", JSON.stringify(users));
                } else if (!backendSession) {
                    setSignupState("This email is already registered. Please use Log In.", "error");
                    alert("This email is already registered. Please use Log In.");
                    return;
                }

                const sessionUser = backendSession?.user || { name, email };
                sessionStorage.setItem("userName", sessionUser.name);
                sessionStorage.setItem("userEmail", email);
                sessionStorage.setItem("isLoggedIn", "true");
                sessionStorage.setItem("authToken", backendSession?.token || "web3-jwt-" + Date.now());

                setSignupState("Account created successfully. Opening your dashboard…", "success");

                alert(backendSession
                    ? `Welcome, ${sessionUser.name}! Your booking account is connected.`
                    : `Welcome, ${name}! Account created successfully.`);
                window.location.href = "dashboard.html";
            });
        });
    </script>

</body>

</html>
